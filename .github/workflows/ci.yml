name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/contentc/package-lock.json

      - name: Validate authored content and generated outputs
        working-directory: tools/contentc
        run: |
          npm ci
          npm run check
          npm test

  native-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

      - name: Validate Godot demo contracts
        run: python3 tests/integration/check_godot_demo.py


  windows-native-bridge:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Debug bridge with a unified MSVC runtime
        run: >-
          cmake -S . -B build/windows-bridge
          -G "Visual Studio 17 2022" -A x64
          -DSTARFALL_BUILD_TESTS=OFF
          -DSTARFALL_BUILD_GODOT_BRIDGE=ON

      - name: Verify generated MSVC runtime settings
        shell: pwsh
        run: |
          $targets = @(
            "starfall_sim_core",
            "godot-cpp",
            "starfall_godot_bridge"
          )
          foreach ($target in $targets) {
            $project = Get-ChildItem build/windows-bridge -Recurse -Filter "$target.vcxproj" |
              Select-Object -First 1
            if (-not $project) {
              throw "Could not find generated project for $target"
            }
            $contents = Get-Content $project.FullName -Raw
            if ($contents -match "MultiThreadedDebugDLL") {
              throw "$target still uses the Debug DLL runtime (/MDd)"
            }
            if ($contents -notmatch "<RuntimeLibrary>MultiThreadedDLL</RuntimeLibrary>") {
              throw "$target does not use the unified DLL runtime (/MD)"
            }
          }

      - name: Build Debug native Godot bridge
        run: >-
          cmake --build build/windows-bridge
          --config Debug
          --parallel
          --target starfall_godot_bridge

  godot-demo:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
      CCACHE_DIR: /home/runner/.cache/ccache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache

      - name: Restore native compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/ccache
          key: godot-bridge-ccache-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

      - name: Download pinned Godot
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/SHA512-SUMS.txt \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt"
          curl --fail --location --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          grep "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" /tmp/SHA512-SUMS.txt \
            | sed "s#Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip#/tmp/godot.zip#" \
            | sha512sum --check
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Configure native Godot bridge
        run: >-
          cmake -S . -B build/godot-bridge -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSTARFALL_BUILD_TESTS=OFF
          -DSTARFALL_BUILD_GODOT_BRIDGE=ON

      - name: Build native Godot bridge
        run: cmake --build build/godot-bridge --target starfall_godot_bridge

      - name: Save native compiler cache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Import Godot project
        run: |
          set -uo pipefail
          GODOT_BIN="/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          set +e
          "${GODOT_BIN}" --headless --path game --import
          FIRST_IMPORT_STATUS=$?
          set -e
          if [[ ${FIRST_IMPORT_STATUS} -eq 0 ]]; then
            exit 0
          fi
          if [[ ${FIRST_IMPORT_STATUS} -ne 134 ]]; then
            exit "${FIRST_IMPORT_STATUS}"
          fi
          echo "First project scan exited with SIGABRT; requiring a clean cached import."
          "${GODOT_BIN}" --headless --path game --import

      - name: Run Godot demo smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/demo_smoke.gd

      - name: Run playable-loop smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/gameplay_smoke.gd

      - name: Run gravity-aligned movement smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/movement_smoke.gd

      - name: Run gravity-follow camera smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/camera_smoke.gd

      - name: Run combat core smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/combat_core_smoke.gd

      - name: Run combat lab smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/combat_lab_smoke.gd

      - name: Run native bridge smoke test
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/native_bridge_smoke.gd

      - name: Compare GDScript and native projectile trajectories
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path game --script res://tests/native_shadow_smoke.gd
